[package]
name = "pkg-earth"
description = "pkg.earth web server and daemon"
version = "0.1.0"
authors = ["Nikolay Govorov <me@govorov.online>"]
edition = "2024"
license = "MPL-2.0"
publish = false
homepage = "https://pkg.earth"
repository = "https://gilti.dev/pkg.earth"

[dependencies]
dimidiumlabs-config = { git = "https://gilti.dev/platform.git", rev = "06e80eab24180b9f56e8ff1e0182aad60e56f734" }
dimidiumlabs-server = { git = "https://gilti.dev/platform.git", rev = "06e80eab24180b9f56e8ff1e0182aad60e56f734" }
dimidiumlabs-ui = { git = "https://gilti.dev/platform.git", rev = "06e80eab24180b9f56e8ff1e0182aad60e56f734" }

async-trait = "0.1"
axum = { version = "0.8", features = ["http2", "macros"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
bytes = "1.11"
chrono = { version = "0.4", features = ["serde"] }
crc32fast = "1.5"
garde = { version = "0.23", features = ["derive"] }
hex = "0.4"
http-body-util = "0.1"
hyper = "1.8"
hyper-tls = "0.6"
hyper-util = { version = "0.1", features = [
  "client-legacy",
  "http1",
  "http2",
  "server-auto",
  "service",
  "tokio",
] }
ipnet = { version = "2", features = ["serde"] }
log = "0.4"
maud = { version = "0.27", features = ["axum"] }
openssl = { version = "0.10", features = ["vendored"] }
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
  "tls12",
] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", features = [
  "sqlite",
  "runtime-tokio",
  "macros",
  "derive",
  "chrono",
  "json",
] }
strum = { version = "0.27", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1.49", features = [
  "rt-multi-thread",
  "macros",
  "time",
  "signal",
  "fs",
  "io-util",
  "net",
] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "ring", "tls12"] }
tokio-util = "0.7"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = [
  "compression-br",
  "compression-gzip",
  "limit",
  "timeout",
  "request-id",
  "set-header",
  "follow-redirect",
  "util",
] }
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.19", features = ["v4", "v5"] }

[target.'cfg(target_os = "linux")'.dependencies]
sd-notify = "0.4"

[build-dependencies]
dimidiumlabs-ui-build = { git = "https://gilti.dev/platform.git", rev = "06e80eab24180b9f56e8ff1e0182aad60e56f734" }

[dev-dependencies]
proptest = "1.6"
tempfile = "3.24"
