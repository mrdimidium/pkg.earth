replicaCount: 1

image:
    repository: ghcr.io/mrdimidium/pkg.earth
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Optional existing ServiceAccount; the chart never creates one.
serviceAccountName: ""
# Appended verbatim to the Pod spec and pkg.earth container.
extraVolumes: []
extraVolumeMounts: []

podAnnotations: {}
podLabels: {}

podSecurityContext:
    runAsNonRoot: true

    runAsUser: 10000
    runAsGroup: 10000

    fsGroup: 10000
    fsGroupChangePolicy: OnRootMismatch

securityContext:
    allowPrivilegeEscalation: false
    capabilities:
        drop: [ALL]
    readOnlyRootFilesystem: true

service:
    port: 2000

config:
    existingConfigMap: ""
    appname: pkg.earth
    hostnames: []
    server:
        shutdownTimeout: "60s"
        requestTimeout: "30s"
        maxBodySize: 64 MiB
        maxConcurrentRequests: 512
        rateLimitPeriod: "10s"
        rateLimitBurstSize: 50
        # CIDR networks allowed to supply X-Forwarded-For. Keep empty unless
        # the Service is reachable only through a header-sanitizing proxy.
        trustedProxies: []
    backends:
        go:
            enabled: true
            refreshInterval: "1h"
        zig:
            enabled: true
            refreshInterval: "1h"
    log:
        enabled: true
        level: info
    extra: ""

persistence:
    enabled: true
    existingClaim: ""
    accessModes: [ReadWriteOnce]
    size: 20Gi
    storageClass: ""

route:
    enabled: false
    hostnames: []
    parentRefs: []

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

terminationGracePeriodSeconds: 70
