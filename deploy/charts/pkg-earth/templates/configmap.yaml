{{- if not .Values.config.existingConfigMap }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pkg-earth.fullname" . }}
  labels:
    {{- include "pkg-earth.labels" . | nindent 4 }}
data:
  pkg-earth.toml: |
    appname = {{ .Values.config.appname | quote }}
    dirname = "/var/lib/pkg-earth"

    [server]
    max_body_size = {{ .Values.config.server.maxBodySize | quote }}
    max_concurrent_requests = {{ .Values.config.server.maxConcurrentRequests }}

    rate_limit_period = {{ .Values.config.server.rateLimitPeriod | quote }}
    rate_limit_burst_size = {{ .Values.config.server.rateLimitBurstSize }}
    trusted_proxies = {{ .Values.config.server.trustedProxies | toJson }}

    request_timeout = {{ .Values.config.server.requestTimeout | quote }}
    shutdown_timeout = {{ .Values.config.server.shutdownTimeout | quote }}

    [[listen]]
    addr = "0.0.0.0:2000"
    hostnames = {{ .Values.config.hostnames | toJson }}

    {{- range $name, $backend := .Values.config.backends }}
    [backends.{{ $name }}]
    enabled = {{ $backend.enabled }}
    refresh_interval = {{ $backend.refreshInterval | quote }}

    {{- end }}
    [log]
    enabled = {{ .Values.config.log.enabled }}
    level = {{ .Values.config.log.level | quote }}
    {{- with .Values.config.extra }}

{{ . | indent 4 }}
    {{- end }}
{{- end }}

