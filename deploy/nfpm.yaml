# yaml-language-server: $schema=https://nfpm.goreleaser.com/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

name: pkg-earth
arch: ${ARCH}
version: ${VERSION}
license: MPL-2.0
platform: linux
# Keep package payloads reproducible across retries of the same release.
mtime: 1970-01-01T00:00:00Z
maintainer: Nikolay Govorov <me@govorov.online>
description: Tiny packages caching proxy

contents:
  - src: ./LICENSE
    dst: /usr/share/doc/pkg-earth/LICENSE
  - src: ./README.md
    dst: /usr/share/doc/pkg-earth/README.md

  - src: target/release/pkg-earth
    dst: /usr/local/bin/pkg-earth
    file_info:
      mode: 0755

  - src: deploy/pkg-earth.toml
    dst: /etc/pkg-earth.toml
    type: config|noreplace
    file_info:
      mode: 0640
      owner: root
      group: pkg-earth

  - src: deploy/pkg-earth.service
    dst: /usr/lib/systemd/system/pkg-earth.service
    packager: deb
    file_info:
      mode: 0644
  - src: deploy/pkg-earth.service
    dst: /usr/lib/systemd/system/pkg-earth.service
    packager: rpm
    file_info:
      mode: 0644
  - src: deploy/pkg-earth.initd
    dst: /etc/init.d/pkg-earth
    packager: apk
    file_info:
      mode: 0755

  - dst: /var/lib/pkg-earth
    type: dir
    file_info:
      mode: 0755
      owner: root
      group: pkg-earth


scripts:
  preinstall: deploy/scripts/preinstall.sh
  postinstall: deploy/scripts/postinstall.sh
  preremove: deploy/scripts/preremove.sh

deb:
  signature:
    method: debsign
    key_id: ${GPG_KEY_ID}
    key_file: ${SIGNING_PRIVATE_KEY}

rpm:
  group: System Environment/Daemons
  signature:
    key_id: ${GPG_KEY_ID}
    key_file: ${SIGNING_PRIVATE_KEY}

apk:
  signature:
    key_file: ${APK_SIGNING_KEY}
    # nFPM appends ".rsa.pub". Keep the generation in the basename so clients
    # can retain historical package keys during signing-key rotation.
    key_name: packages.${PACKAGE_KEY_VERSION}
