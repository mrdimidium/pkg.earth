# pkg.earth will dutifully indicate its user agent and protocols (for example, source for zig).
# Specify your name if you want your instance to be identified.
appname="pkg.earth"

# Path to the directory for storing state (indexes, caches, statistics).
# Must be a writable directory.
dirname="/var/lib/pkg-earth"

# Common server settings
[server]
shutdown_timeout = "60s"
request_timeout = "30s"
max_body_size = "64 MiB"
max_concurrent_requests = 512
rate_limit_period = "10s"
rate_limit_burst_size = 50
# CIDR networks allowed to supply X-Forwarded-For. Keep empty for direct use.
trusted_proxies = []

# Listeners configuration. Each listener has an address and optional hostnames.
# Empty hostnames means accept all requests (catch-all).
[[listen]]
addr = "0.0.0.0:2025"
hostnames = ["localhost", "127.0.0.1", "[::1]"]

# For HTTPS, set tls_cert and tls_key to PEM file paths.
# tls_crt = "/etc/pkg-earth/cert.pem"
# tls_key = "/etc/pkg-earth/key.pem"

# Text logs to stdout.
[log]
enabled = true
level = "info" # trace, debug, info, warning, error

# Environment variable PKG_EARTH_LOG overrides the configured level.
# Example: PKG_EARTH_LOG=debug
