# pkg.earth will dutifully indicate its user agent and protocols (for example, source for zig).
# Specify your name if you want your instance to be identified.
appname="pkg.earth"

# Path to the directory for storing state (indexes, caches, statistics).
# Must be a writable directory.
dirname="/var/lib/pkg-earth"

# Common server settings
[server]
shutdown_timeout = "60s"
request_timeout = "30s"
max_body_size = "64 MiB"
max_concurrent_requests = 512
rate_limit_period = "10s"
rate_limit_burst_size = 50
# CIDR networks allowed to supply X-Forwarded-For. Keep empty for direct use.
trusted_proxies = []

# Listeners configuration. Each listener has an address and optional hostnames.
# Empty hostnames means accept all requests (catch-all).
[[listen]]
addr = "0.0.0.0:2025"
hostnames = ["localhost", "127.0.0.1", "[::1]"]

# For HTTPS, set tls_cert and tls_key to PEM file paths.
# tls_crt = "/etc/pkg-earth/cert.pem"
# tls_key = "/etc/pkg-earth/key.pem"

# Telemetry configuration
# Logs to stdout (pretty or json format)
[telemetry.stdout]
enabled = true
log_level = "info"      # trace, debug, info, warning, error
log_format = "pretty"   # pretty, json

# OpenTelemetry Collector (OTLP)
# Uncomment to enable sending logs and traces to an OTLP collector
# [telemetry.otelcol]
# enabled = true
# logs = true
# traces = true
# endpoint = "http://localhost:4318"  # HTTP protocol (no TLS)
# # endpoint = "grpc://localhost:4317" # gRPC protocol (requires TLS)
# timeout = "10s"
# log_level = "info"
#
# # For gRPC with TLS, specify certificates:
# # tls_ca = "/etc/pkg-earth/otel-ca.crt"
# # tls_crt = "/etc/pkg-earth/otel-client.crt"  # for mTLS
# # tls_key = "/etc/pkg-earth/otel-client.key"  # for mTLS
#
# # HTTP headers for authentication:
# # [telemetry.otelcol.headers]
# # Authorization = "Bearer <token>"

# Environment variable PKG_EARTH_LOG overrides log_level settings.
# Example: PKG_EARTH_LOG=debug,sqlx=warn
